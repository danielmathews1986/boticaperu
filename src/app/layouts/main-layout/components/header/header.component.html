<header class="w-fullborder-b">
  <!-- TOP BAR -->
  <div class="bg-personalize text-white text-center py-2 text-sm font-medium">
    Es un hecho establecido hace demasiado tiempo que un lector.
  </div>
  <!-- LOGO + SEARCH + CART -->
  <div class="flex items-center justify-between px-8 py-5">
    <!-- LOGO -->
    <div class="text-3xl font-bold">
      <a routerLink="/farmacia" class="text-[13px] font-normal text-[#354159] cursor-pointer">
        <img src="/logo/Group.svg" alt="logo">
      </a>
     
    </div>

    <!-- search desktop-->
    <div class="flex items-center rounded-full px-4 py-2 w-[400px] bg-[#F8F8F8] relative hidden md:flex">
      <input type="text" placeholder="Busca una marca o producto" class="ml-3 w-full outline-none bg-[#F8F8F8]" />
      <div
        class="bg-[#17A15B] absolute right-0 top-0 w-10 h-10 rounded-[26px] p-[0.7rem] flex items-center justify-center">
        <img [src]="search" alt="producto" class="max-w-[20px] ">
      </div>
    </div>

    <!-- CART -->
    <div class="flex items-center gap-2 relative rounded-lg bg-[#EAF7FE] w-[68px] h-[40px] justify-center">
      <img [src]="image" alt="producto" class="max-w-[20px]">
      <span class="font-semibold mt-1 text-[#1A8FF1] text-[14px]">
        {{ cartService.cartCount() }}
      </span>
    </div>
  </div>

  <!-- search desktop-->
  <div
    class="flex mt-3 mb-3 items-center rounded-full px-12 py-2 w-auto bg-[#F8F8F8] relative block min-[992px]:hidden mx-4">
    <input type="text" placeholder="Busca una marca o producto"
      class="ml-3 w-full outline-none bg-[#F8F8F8] font-thin" />
    <div
      class="bg-[#17A15B] absolute right-0 top-0 w-10 h-10 rounded-[26px] p-[0.7rem] flex items-center justify-center">
      <img [src]="search" alt="producto" class="max-w-[20px]">
    </div>
  </div>

  <!-- NAVBAR -->

  <app-nabvar></app-nabvar>

</header>
